name = "voxora"
main = "src/index.js"
compatibility_date = "2026-11-03"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "VOXORA_DB"
database_name = "voxora-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

